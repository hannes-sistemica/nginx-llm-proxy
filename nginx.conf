# llm-proxy — LLM model router with multi-backend failover
#
# Proxies OpenAI-compatible API requests to multiple backends (llama-server,
# vLLM, mlx) based on the "model" field in the JSON request body, with
# per-model backend pools, health checks, and forced-backend (@name) routing.
#
# Setup:
#   1. Install at /opt/llm-proxy (or edit the paths below to match).
#   2. Create config.json from config.example.json.
#   3. sudo cp nginx.conf /etc/nginx/http.d/llm-proxy.conf   # (Alpine/OpenResty)
#      or  /etc/nginx/sites-enabled/llm-proxy                # (Debian nginx-extras)
#   4. sudo nginx -t && sudo nginx -s reload
#
# Admin UI/API are IP-restricted to localhost + LAN (192.168/16) + Tailscale
# (100.64/10). Adjust the allow lists for your network.

lua_package_path "/opt/llm-proxy/?.lua;;";
lua_shared_dict llm_stats 10m;

init_by_lua_block {
    local proxy = require("llm-proxy")
    proxy.init("/opt/llm-proxy/config.json", "/opt/llm-proxy/admin.html")
}

init_worker_by_lua_block {
    require("llm-proxy").init_worker()
}

server {
    listen 4000;
    server_name _;

    client_max_body_size 64m;
    lua_need_request_body off;
    client_body_buffer_size 2m;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /v1/models {
        default_type application/json;
        content_by_lua_block {
            local proxy = require("llm-proxy")
            proxy.check_auth()
            proxy.models()
        }
    }

    location /admin/static/ {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        deny all;
        alias /opt/llm-proxy/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /admin {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        deny all;
        content_by_lua_block {
            require("llm-proxy").serve_admin_html()
        }
    }

    location /admin/api/ {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        deny all;
        content_by_lua_block {
            require("llm-proxy").admin_api()
        }
    }

    location = /admin/reload {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        content_by_lua_block {
            local proxy = require("llm-proxy")
            local ok, err = proxy.reload()
            if ok then
                ngx.say('{"status":"reloaded"}')
            else
                ngx.status = 500
                ngx.say('{"status":"error","message":"' .. (err or "unknown") .. '"}')
            end
        }
    }

    location /v1/ {
        set $backend "";

        access_by_lua_block {
            local proxy = require("llm-proxy")
            proxy.check_auth()
            proxy.route()
        }

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        body_filter_by_lua_block {
            require("llm-proxy").capture_response()
        }

        log_by_lua_block {
            require("llm-proxy").log_usage()
        }
    }


    # ── /v1/audio/transcriptions ──────────────────────────────────────────
    # OpenAI-shape STT, bridged to the MLX Whisper service on Mac Studio.
    # The MLX server speaks the same multipart shape but uses X-API-Key
    # instead of Bearer, and returns {text, language, duration} — already
    # compatible with OpenAI's /audio/transcriptions response. The OpenAI
    # `model` form field is ignored upstream (MLX has one model loaded);
    # other fields (prompt, temperature) are likewise ignored for v1.
    #
    # NOTE: set the upstream key for your deployment — do NOT commit a real
    # secret here. Replace <WHISPER_API_KEY> with the MLX service key.
    location = /v1/audio/transcriptions {
        access_by_lua_block {
            require("llm-proxy").check_auth()
        }

        # Swap Bearer for the MLX server's X-API-Key. Strip the original
        # so it can't pass through and confuse the upstream.
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "<WHISPER_API_KEY>";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
        proxy_request_buffering on;
        client_max_body_size 256m;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://192.168.1.254:8000/transcribe/file;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"message":"Not found. Use /v1/chat/completions, /v1/embeddings, or /v1/models","type":"invalid_request_error","code":"404"}}';
    }
}
